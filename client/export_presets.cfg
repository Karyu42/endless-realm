; Export presets for CI (.github/workflows/ci.yml, export-builds). Names must match
; the matrix: "Linux", "Windows Desktop", "Android". No keystore, password or
; signing secret belongs in this file: Android debug signing comes from the
; editor settings / GODOT_ANDROID_KEYSTORE_DEBUG_* env vars that CI sets.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, test_results/*, addons/gut/*"
export_path="../export-out/linux/endless-realm.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"

[preset.1]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
