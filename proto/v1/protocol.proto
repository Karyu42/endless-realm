syntax = "proto3";

package endless.v1;

option go_package = "github.com/Karyu42/endless-realm/server/internal/protocol/v1;protocolv1";

// Protocol v1. The protocol_version field is the agreed u16 version
// (proto3 has no uint16; the value must be exactly 1).
//
// This file is additive: new fields and oneof members do not bump the
// handshake version. Old clients (Hello + InputFrame only) keep working.
//
// Wire: binary WebSocket frames containing a ClientMessage or ServerMessage.
// Angles are radians in Godot 2D convention (+X = 0, +Y down, clockwise
// positive). float fields are float32 on the wire; sim math is float64.
// Time in snapshots is tick index, not milliseconds.
//
// Portal multiplier is uint32 m100 (whole hundredths), never a float.
//
// Entity and player ids are uint64 (one shared id counter on the host; a
// uint32 could wrap in a long-lived lobby). seq and tick stay uint32.
// Widening a varint from uint32 to uint64 does not change its encoding.
//
// Names avoid clashes in generated GDScript: no field named instance_id
// (Object.get_instance_id) and no message named Error (Godot's Error enum).

message Hello {
  uint32 protocol_version = 1;
}

message Welcome {
  uint32 protocol_version = 1;
  uint64 player_id = 2;
  uint32 tick_hz = 3;
  uint64 instance_seed = 4;
  // Display only; the client must not use this to compute rewards.
  float multiplier = 5;
  // Instance this session starts in (the process default / smoke instance).
  uint64 instance = 6;
  // Locked M100 of instance. Prefer this over the display float.
  uint32 m100 = 7;
}

message Reject {
  uint32 server_protocol_version = 1;
  uint32 client_protocol_version = 2;
  string reason = 3;
}

message InputFrame {
  uint32 seq = 1;
  float move_x = 2;
  float move_y = 3;
  // Radians, Godot 2D convention. No sign flips on the server.
  float aim = 4;
  bool fire_held = 5;
  // Entity id of the interactable (loot bag, portal, vendor) the client
  // prompted for. 0 or unset means no interact. Nonzero is an interact press
  // on this frame's seq. The host applies it at most once per seq and drops
  // it silently (no ErrorReply) if the id is unknown, the target is not
  // allowed for this player, or it is more than 2.0 tiles away, center to
  // center, as measured by the host.
  uint64 interact_target_id = 6;
  // Class ability press. false or unset means no ability. true is a press on
  // this frame's seq; clients do not resend it on later frames. The host
  // applies it at most once per seq and rejects seq 0. It is a silent no-op
  // (no ErrorReply) when Focus or the cooldown does not allow the ability.
  // One-shot: cleared after the tick it is applied in.
  bool ability_pressed = 7;
}

// Snapshot is a stub: tick plus the last applied input seq per connected player.
message Snapshot {
  uint32 tick = 1;
  repeated PlayerStub players = 2;
  // Loot bags visible to the receiving player: only that player's own bags.
  // Each recipient gets its own list; it is empty for most players.
  repeated LootBag bags = 3;
  // Portals and markers in the receiving player's current instance only.
  repeated PortalState portals = 4;
  // Entrances in `portals` this receiving player may still re-enter even
  // when `closed` (an earlier admission); the only per-viewer portal data.
  repeated uint64 admitted_portal_ids = 5;
}

// PortalSnapshot kind; names are packed-data ids, never display names.
enum PortalKind {
  PORTAL_KIND_UNSPECIFIED = 0;
  ENTER = 1;
  EXIT = 2;
  PLACEHOLDER = 3;
}

message PortalState {
  uint64 id = 1;
  float x = 2;
  float y = 3;
  float radius = 4;
  PortalKind kind = 5;
  string dungeon_id = 6;
  string marker_id = 7;
  uint32 m100 = 8;
  uint32 base_level = 9;
  uint32 content_level = 10;
  uint32 capacity = 11;
  uint32 admitted_count = 12;
  // Closed for new entry: host-closed or past its admission deadline. The
  // same for every viewer; see Snapshot.admitted_portal_ids for re-entry.
  bool closed = 13;
  bool persistent = 14;
  bool grants_persistent = 15;
  // Host tick deadline for new admissions; 0 for persistent doors / markers.
  uint32 expire_tick = 16;
}

// A personal loot bag on the ground (tile units). Item details stay
// server-side until pickup.
message LootBag {
  uint64 id = 1;
  float x = 2;
  float y = 3;
  uint64 owner_player_id = 4;
  // Tier reference (T*); the client derives the bag color from it.
  uint32 t_star = 5;
  // Server tick the bag dropped on.
  uint32 spawn_tick = 6;
}

message PlayerStub {
  uint64 id = 1;
  uint32 applied_seq = 2;
}

// Open a new portal instance with a locked multiplier.
// m100 is whole hundredths: 50 ≤ m100 ≤ 150 and m100 % 5 == 0 (v0.1).
// On success the opener is moved into the new instance.
message OpenPortal {
  uint32 m100 = 1;
}

// Join an existing instance by id (including the default instance, which
// returns the session to the process default / hub).
message JoinInstance {
  uint64 instance = 1;
}

// Return to the process default instance without closing the portal.
message LeaveInstance {}

message ListInstances {}

message InstanceInfo {
  uint64 instance = 1;
  uint32 m100 = 2;
  // Unset (0) in InstanceList. Seeds are only sent on Welcome,
  // OpenPortalOk, and JoinInstanceOk for the caller's own instance.
  uint64 seed = 3;
  uint32 player_count = 4;
  bool is_default = 5;
  uint32 base_level = 6;
  uint32 capacity = 7;
  uint32 admitted_count = 8;
  // Same meaning as PortalState.closed for the entrance behind it.
  bool closed = 9;
}

message OpenPortalOk {
  uint64 instance = 1;
  uint32 m100 = 2;
  uint64 seed = 3;
}

message JoinInstanceOk {
  uint64 instance = 1;
  uint32 m100 = 2;
  uint64 seed = 3;
}

message InstanceList {
  repeated InstanceInfo instances = 1;
}

// Application error (the connection stays open). Handshake failures still
// use Reject and close the socket.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  INVALID_MULTIPLIER = 1;
  INSTANCE_NOT_FOUND = 2;
  ALREADY_IN_INSTANCE = 3;
  INSTANCE_FULL = 4;
  OPEN_PORTAL_LIMIT = 5;
  // The portal's multiplier is outside the lobby's allowed range.
  MULTIPLIER_NOT_ALLOWED = 6;
  // The player does not meet the requirements to join this instance.
  JOIN_REFUSED = 7;
}

message ErrorReply {
  ErrorCode code = 1;
  string reason = 2;
}

message ClientMessage {
  oneof payload {
    Hello hello = 1;
    InputFrame input = 2;
    OpenPortal open_portal = 3;
    JoinInstance join_instance = 4;
    ListInstances list_instances = 5;
    LeaveInstance leave_instance = 6;
  }
}

message ServerMessage {
  oneof payload {
    Welcome welcome = 1;
    Reject reject = 2;
    Snapshot snapshot = 3;
    OpenPortalOk open_portal_ok = 4;
    JoinInstanceOk join_instance_ok = 5;
    InstanceList instance_list = 6;
    ErrorReply error = 7;
  }
}
