# Multi-client soak: N bot clients against the compose stack for ~10 minutes.
# Nightly + on demand. NOT a required check (it never runs on pull_request).
name: soak

on:
  workflow_dispatch:
    inputs:
      clients:
        description: Bot clients to run (8-32)
        default: "16"
        required: true
      minutes:
        description: Soak duration in minutes
        default: "10"
        required: true
  schedule:
    - cron: "17 2 * * *"   # nightly, 02:17 UTC

permissions:
  contents: read

env:
  SERVER_URL: ws://127.0.0.1:8080/ws
  HEALTHZ_URL: http://127.0.0.1:8080/healthz

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      clients: ${{ steps.plan.outputs.clients }}
      minutes: ${{ steps.plan.outputs.minutes }}
    steps:
      - id: plan
        env:
          IN_CLIENTS: ${{ inputs.clients }}
          IN_MINUTES: ${{ inputs.minutes }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$IN_CLIENTS" =~ ^[0-9]+$ ]] || [ "$IN_CLIENTS" -lt 8 ] || [ "$IN_CLIENTS" -gt 32 ]; then
              echo "::error::clients must be an integer from 8 to 32 (got '$IN_CLIENTS')"; exit 1
            fi
            if ! [[ "$IN_MINUTES" =~ ^[0-9]+$ ]] || [ "$IN_MINUTES" -lt 1 ] || [ "$IN_MINUTES" -gt 60 ]; then
              echo "::error::minutes must be an integer from 1 to 60 (got '$IN_MINUTES')"; exit 1
            fi
            echo "clients=[${IN_CLIENTS}]" >> "$GITHUB_OUTPUT"
            echo "minutes=${IN_MINUTES}" >> "$GITHUB_OUTPUT"
          else
            echo "clients=[8, 32]" >> "$GITHUB_OUTPUT"
            echo "minutes=10" >> "$GITHUB_OUTPUT"
          fi

  soak:
    name: soak (${{ matrix.clients }} clients)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        clients: ${{ fromJSON(needs.plan.outputs.clients) }}
    env:
      MINUTES: ${{ needs.plan.outputs.minutes }}
      CLIENTS: ${{ matrix.clients }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: inputs
        name: Check inputs (compose file, server/cmd/bot)
        run: |
          compose=""
          for f in compose.yaml compose.yml docker-compose.yaml docker-compose.yml; do
            if [ -f "$f" ]; then compose="$f"; break; fi
          done
          if [ ! -d server/cmd/bot ] || [ ! -f server/go.mod ]; then
            .github/scripts/skip-notice.sh "server/cmd/bot not present yet"
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$compose" ]; then
            .github/scripts/skip-notice.sh "docker-compose file (compose.yaml / docker-compose.yml) not present yet"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "compose=$compose" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.inputs.outputs.present == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build bot client
        if: steps.inputs.outputs.present == 'true'
        working-directory: server
        run: go build -o "${RUNNER_TEMP}/er-bot" ./cmd/bot
      - name: docker compose up --wait
        if: steps.inputs.outputs.present == 'true'
        env:
          COMPOSE_FILE: ${{ steps.inputs.outputs.compose }}
        run: docker compose --env-file tools/versions.env up --build --detach --wait --wait-timeout 300
      - name: Wait for server /healthz
        if: steps.inputs.outputs.present == 'true'
        env:
          COMPOSE_FILE: ${{ steps.inputs.outputs.compose }}
        run: |
          # `up --wait` already waits on the server's compose healthcheck (`/server -healthcheck`,
          # run inside the container). This also proves the published port answers from the runner,
          # which is the address the bot uses.
          for i in $(seq 1 60); do
            if curl -sf --max-time 2 "$HEALTHZ_URL" > /dev/null; then
              echo "server healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::$HEALTHZ_URL did not return 2xx within ~120 s"
          docker compose --env-file tools/versions.env ps --all
          docker compose --env-file tools/versions.env logs --no-color --timestamps --tail=200
          exit 1
      - name: Soak (${{ matrix.clients }} clients)
        if: steps.inputs.outputs.present == 'true'
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          bot="${RUNNER_TEMP}/er-bot"
          if "$bot" -h 2>&1 | grep -q -- '-duration'; then
            # Bot supports a duration flag: it must exit 0 by itself.
            set -e
            timeout "$((MINUTES + 5))m" "$bot" -url="$SERVER_URL" -clients="$CLIENTS" -seed=1 -mult=1.0 -duration="${MINUTES}m" 2>&1 | tee ci-logs/bot.log
          else
            # No duration flag yet: run for MINUTES and stop it. Only a timeout stop (124) counts as success;
            # an earlier exit, crash or non-zero code fails the job.
            timeout --signal=INT --kill-after=30s "${MINUTES}m" "$bot" -url="$SERVER_URL" -clients="$CLIENTS" -seed=1 -mult=1.0 2>&1 | tee ci-logs/bot.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 124 ]; then
              echo "::error::bot exited with code $rc before the ${MINUTES}-minute soak finished"
              exit 1
            fi
            echo "Soak ran the full ${MINUTES} minutes."
          fi
      - name: Server health after soak
        if: steps.inputs.outputs.present == 'true'
        env:
          COMPOSE_FILE: ${{ steps.inputs.outputs.compose }}
        run: |
          docker compose --env-file tools/versions.env ps --all | tee ci-logs/compose-ps.txt
          # Every service that was up must still be running (no crash / restart loop during the soak).
          bad="$(docker compose --env-file tools/versions.env ps --all --format '{{.Service}} {{.State}}' | awk '$2 != "running" {print}')"
          if [ -n "$bad" ]; then echo "::error::services not running after soak: $bad"; exit 1; fi
      - name: Collect compose logs
        if: always() && steps.inputs.outputs.present == 'true'
        env:
          COMPOSE_FILE: ${{ steps.inputs.outputs.compose }}
        run: |
          mkdir -p ci-logs
          docker compose --env-file tools/versions.env logs --no-color --timestamps > ci-logs/compose.log 2>&1 || echo "compose logs failed" >> ci-logs/compose.log
          docker stats --no-stream > ci-logs/docker-stats.txt 2>&1 || echo "docker stats failed" >> ci-logs/docker-stats.txt
      - name: docker compose down -v
        if: always() && steps.inputs.outputs.present == 'true'
        env:
          COMPOSE_FILE: ${{ steps.inputs.outputs.compose }}
        run: docker compose --env-file tools/versions.env down -v --remove-orphans
      - name: Upload soak logs
        if: always() && steps.inputs.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-logs-${{ matrix.clients }}-clients
          path: ci-logs/
          if-no-files-found: warn
