# Endless Realm CI.
#
# Job names below are stable on purpose: they become required status checks on main.
#   data-validate, proto-codegen-check, server-build-test, client-tests,
#   fixtures-parity, integration-smoke, export-builds (linux|windows|android)
# godot-host-smoke is NOT required yet: it becomes required after 10 clean runs on
# main (docs/qa/test-plan.md).
#
# Every job first checks that its inputs exist. If one is missing it prints
# "skipped: <path> not present yet" (as a notice and in the job summary) and passes.
# Once the inputs exist the job really runs; nothing is masked with `|| true`.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2-stable
  # Published SHA512s from https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/SHA512-SUMS.txt
  GODOT_EDITOR_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
  GODOT_TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079
  GUT_VERSION: v9.7.1
  # GUT publishes no checksums: sha256 of https://github.com/bitwes/Gut/archive/refs/tags/v9.7.1.tar.gz, computed and pinned.
  GUT_SHA256: 6da99c4e9228d9bec3fb4bd1730a487770a989f0f511dac82a2897a964613385
  # Compose stack endpoints used by integration-smoke.
  SERVER_URL: ws://127.0.0.1:8080/ws
  HEALTHZ_URL: http://127.0.0.1:8080/healthz

defaults:
  run:
    shell: bash

jobs:
  data-validate:
    name: data-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: inputs
        uses: ./.github/actions/check-inputs
        with:
          paths: data/schema
      - if: steps.inputs.outputs.present == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - if: steps.inputs.outputs.present == 'true'
        run: pip install check-jsonschema==0.39.0
      - name: Validate data/ against data/schema/
        if: steps.inputs.outputs.present == 'true'
        run: python3 .github/scripts/validate-data.py
      - name: make data-validate (if the Makefile has it)
        if: steps.inputs.outputs.present == 'true'
        run: |
          if .github/scripts/has-make-target.sh data-validate; then
            make data-validate
          else
            .github/scripts/skip-notice.sh "Makefile target data-validate not present yet (built-in schema checks above still ran)"
          fi

  proto-codegen-check:
    name: proto-codegen-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: inputs
        uses: ./.github/actions/check-inputs
        with:
          paths: |
            proto
            server/go.mod
            Makefile
      - id: target
        if: steps.inputs.outputs.present == 'true'
        run: |
          if .github/scripts/has-make-target.sh proto; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            .github/scripts/skip-notice.sh "Makefile target proto not present yet"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.target.outputs.present == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - id: godobuf
        if: steps.target.outputs.present == 'true'
        run: |
          if grep -qi godobuf Makefile; then echo "needed=true" >> "$GITHUB_OUTPUT"; else echo "needed=false" >> "$GITHUB_OUTPUT"; fi
      - name: Set up Godot (godobuf GDScript codegen)
        if: steps.target.outputs.present == 'true' && steps.godobuf.outputs.needed == 'true'
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          editor-sha512: ${{ env.GODOT_EDITOR_SHA512 }}
      - name: make tools (if the Makefile has it)
        if: steps.target.outputs.present == 'true'
        run: |
          # The pinned toolchain lives in tools/versions.env; `make proto` installs protoc and
          # protoc-gen-go itself. A separate `tools` target is optional.
          if .github/scripts/has-make-target.sh tools; then make tools; fi
      - name: make proto
        if: steps.target.outputs.present == 'true'
        run: make proto GODOT="${GODOT:-godot}"
      - name: Generated code must be committed
        if: steps.target.outputs.present == 'true'
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::make proto changed or added files. Run 'make proto' and commit the result."
            git diff
            exit 1
          fi
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  server-build-test:
    name: server-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: inputs
        uses: ./.github/actions/check-inputs
        with:
          paths: server/go.mod
      - if: steps.inputs.outputs.present == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: make test (vet + go test -race), or raw go commands
        if: steps.inputs.outputs.present == 'true'
        env:
          # Applied to every go command make runs; keeps CI from hanging and from using cached results.
          GOFLAGS: -timeout=3m -count=1
        run: |
          if .github/scripts/has-make-target.sh test; then
            make test
          else
            echo "No Makefile 'test' target; running go vet / go test directly."
            (cd server && go vet ./... && go test -race ./...)
          fi
      - name: go build
        if: steps.inputs.outputs.present == 'true'
        working-directory: server
        run: go build ./...

  client-tests:
    name: client-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: inputs
        uses: ./.github/actions/check-inputs
        with:
          paths: client/project.godot
      - if: steps.inputs.outputs.present == 'true'
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          editor-sha512: ${{ env.GODOT_EDITOR_SHA512 }}
      - name: Install GUT (unless vendored)
        if: steps.inputs.outputs.present == 'true'
        run: .github/scripts/install-gut.sh client "$GUT_VERSION" "$GUT_SHA256"
      - name: godot --headless --import
        if: steps.inputs.outputs.present == 'true'
        run: godot --headless --path client --import
      - name: Run GUT
        if: steps.inputs.outputs.present == 'true'
        env:
          JUNIT: ${{ runner.temp }}/gut/junit.xml
        run: |
          set -o pipefail
          mkdir -p "$(dirname "$JUNIT")"
          args=(-gexit "-gjunit_xml_file=${JUNIT}")
          if [ ! -f client/.gutconfig.json ]; then
            dirs=()
            for d in test tests; do [ -d "client/$d" ] && dirs+=("res://$d"); done
            if [ ${#dirs[@]} -eq 0 ]; then
              echo "::error::client/project.godot exists but there is no client/.gutconfig.json, client/test/ or client/tests/. CI requires GUT tests."
              exit 1
            fi
            args+=("-gdir=$(IFS=,; echo "${dirs[*]}")" -ginclude_subdirs)
          fi
          godot --headless --path client -s res://addons/gut/gut_cmdln.gd "${args[@]}" 2>&1 | tee "${RUNNER_TEMP}/gut/gut.log"
      - name: Require JUnit XML with >0 tests
        if: steps.inputs.outputs.present == 'true'
        run: python3 .github/scripts/check-junit.py "${RUNNER_TEMP}/gut/junit.xml"
      - name: Upload GUT results
        if: always() && steps.inputs.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gut-results
          path: ${{ runner.temp }}/gut/
          if-no-files-found: warn

  fixtures-parity:
    name: fixtures-parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: inputs
        uses: ./.github/actions/check-inputs
        with:
          paths: |
            fixtures
            server/go.mod
            client/project.godot
            Makefile
      - id: target
        if: steps.inputs.outputs.present == 'true'
        run: |
          if .github/scripts/has-make-target.sh fixtures-parity; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            .github/scripts/skip-notice.sh "Makefile target fixtures-parity not present yet"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.target.outputs.present == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - if: steps.target.outputs.present == 'true'
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          editor-sha512: ${{ env.GODOT_EDITOR_SHA512 }}
      - name: Install GUT (unless vendored)
        if: steps.target.outputs.present == 'true'
        run: .github/scripts/install-gut.sh client "$GUT_VERSION" "$GUT_SHA256"
      - name: godot --headless --import
        if: steps.target.outputs.present == 'true'
        run: godot --headless --path client --import
      - name: make fixtures-parity (Go and GDScript against the same golden fixtures)
        if: steps.target.outputs.present == 'true'
        run: make fixtures-parity GODOT="$GODOT"

  godot-host-smoke:
    # Not a required check yet (docs/qa/test-plan.md): required after 10 clean runs on main.
    name: godot-host-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: inputs
        uses: ./.github/actions/check-inputs
        with:
          paths: |
            client/project.godot
            client/src/net/host/host_main.gd
            server/go.mod
            server/cmd/bot
            tools/loadtest/godot_host_loadtest.py
      - if: steps.inputs.outputs.present == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - if: steps.inputs.outputs.present == 'true'
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          editor-sha512: ${{ env.GODOT_EDITOR_SHA512 }}
      - name: godot --headless --import
        if: steps.inputs.outputs.present == 'true'
        run: godot --headless --path client --import
      - name: Host load smoke (5 clients, 10 s)
        if: steps.inputs.outputs.present == 'true'
        run: >-
          python3 tools/loadtest/godot_host_loadtest.py --godot godot
          --clients 5 --duration 10 --max-skipped-ticks 0 --max-p99-ms 40
      - name: Job summary
        if: always() && steps.inputs.outputs.present == 'true'
        run: |
          if [ -f loadtest-results/results.md ]; then
            { echo "### godot-host-smoke"; echo; cat loadtest-results/results.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload loadtest-results
        if: always() && steps.inputs.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: godot-host-smoke-results
          path: loadtest-results/
          if-no-files-found: warn

  integration-smoke:
    name: integration-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: inputs
        name: Check inputs (compose file, server/cmd/bot)
        run: |
          compose=""
          for f in compose.yaml compose.yml docker-compose.yaml docker-compose.yml; do
            if [ -f "$f" ]; then compose="$f"; break; fi
          done
          if [ -z "$compose" ]; then
            .github/scripts/skip-notice.sh "docker-compose file (compose.yaml / docker-compose.yml) not present yet"
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [ ! -d server/cmd/bot ]; then
            .github/scripts/skip-notice.sh "server/cmd/bot not present yet"
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [ ! -f server/go.mod ]; then
            .github/scripts/skip-notice.sh "server/go.mod not present yet"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "compose=$compose" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.inputs.outputs.present == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build bot client
        if: steps.inputs.outputs.present == 'true'
        working-directory: server
        run: go build -o "${RUNNER_TEMP}/er-bot" ./cmd/bot
      - name: docker compose up --wait
        if: steps.inputs.outputs.present == 'true'
        env:
          COMPOSE_FILE: ${{ steps.inputs.outputs.compose }}
        run: docker compose --env-file tools/versions.env up --build --detach --wait --wait-timeout 300
      - name: Wait for server /healthz
        if: steps.inputs.outputs.present == 'true'
        env:
          COMPOSE_FILE: ${{ steps.inputs.outputs.compose }}
        run: |
          # `up --wait` already waits on the server's compose healthcheck (`/server -healthcheck`,
          # run inside the container). This also proves the published port answers from the runner,
          # which is the address the bot uses.
          for i in $(seq 1 60); do
            if curl -sf --max-time 2 "$HEALTHZ_URL" > /dev/null; then
              echo "server healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::$HEALTHZ_URL did not return 2xx within ~120 s"
          docker compose --env-file tools/versions.env ps --all
          docker compose --env-file tools/versions.env logs --no-color --timestamps --tail=200
          exit 1
      - name: Bot client smoke (1 client, seed 1, mult 1.0)
        if: steps.inputs.outputs.present == 'true'
        run: |
          set -o pipefail
          mkdir -p ci-logs
          timeout 5m "${RUNNER_TEMP}/er-bot" -url="$SERVER_URL" -clients=1 -seed=1 -mult=1.0 2>&1 | tee ci-logs/bot.log
      - name: Collect compose logs
        if: always() && steps.inputs.outputs.present == 'true'
        env:
          COMPOSE_FILE: ${{ steps.inputs.outputs.compose }}
        run: |
          mkdir -p ci-logs
          docker compose --env-file tools/versions.env ps --all > ci-logs/compose-ps.txt 2>&1 || echo "compose ps failed" >> ci-logs/compose-ps.txt
          docker compose --env-file tools/versions.env logs --no-color --timestamps > ci-logs/compose.log 2>&1 || echo "compose logs failed" >> ci-logs/compose.log
      - name: docker compose down -v
        if: always() && steps.inputs.outputs.present == 'true'
        env:
          COMPOSE_FILE: ${{ steps.inputs.outputs.compose }}
        run: docker compose --env-file tools/versions.env down -v --remove-orphans
      - name: Upload logs on failure
        if: failure() && steps.inputs.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-smoke-logs
          path: ci-logs/
          if-no-files-found: warn

  export-builds:
    name: export-builds (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            preset: Linux
            output: endless-realm.x86_64
            artifact: endless-realm-linux-debug
          - target: windows
            preset: Windows Desktop
            output: endless-realm.exe
            artifact: endless-realm-windows-debug
          - target: android
            preset: Android
            output: endless-realm.apk
            artifact: endless-realm-android-debug-apk
    env:
      PRESET: ${{ matrix.preset }}
      OUT_DIR: ${{ github.workspace }}/export-out/${{ matrix.target }}
      OUT_FILE: ${{ matrix.output }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: inputs
        uses: ./.github/actions/check-inputs
        with:
          paths: |
            client/project.godot
            client/export_presets.cfg
      - name: Preset must exist in export_presets.cfg
        if: steps.inputs.outputs.present == 'true'
        run: |
          if ! grep -qxF "name=\"${PRESET}\"" client/export_presets.cfg; then
            echo "::error::client/export_presets.cfg has no preset named \"${PRESET}\". Add it (export-builds (${{ matrix.target }}) expects that exact name)."
            exit 1
          fi
      - if: steps.inputs.outputs.present == 'true'
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          editor-sha512: ${{ env.GODOT_EDITOR_SHA512 }}
          templates: "true"
          templates-sha512: ${{ env.GODOT_TEMPLATES_SHA512 }}

      # ---- Android only: JDK 17, SDK, CI-generated debug keystore (nothing secret is committed) ----
      - if: steps.inputs.outputs.present == 'true' && matrix.target == 'android'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - if: steps.inputs.outputs.present == 'true' && matrix.target == 'android'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Godot 4.7.2's Android template targets SDK 36 (min 24); match build-tools to it.
          packages: platform-tools build-tools;36.0.0 platforms;android-36
      # Debug signing only (release keys are a separate, later decision). Same-repo
      # PRs and pushes get the fixed repo-secret key, so successive APKs install
      # over each other. Fork PRs get an empty secret and fall back to an
      # ephemeral key. This workflow has no pull_request_target trigger.
      - name: Debug keystore + Godot Android editor settings
        if: steps.inputs.outputs.present == 'true' && matrix.target == 'android'
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          ks="${RUNNER_TEMP}/debug.keystore"
          if [ -n "${ANDROID_DEBUG_KEYSTORE_B64:-}" ]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_B64" | base64 -d > "$ks"
            chmod 600 "$ks"
            keytool -list -keystore "$ks" -storepass android -alias androiddebugkey >/dev/null \
              || { echo "::error::ANDROID_DEBUG_KEYSTORE_B64 is not a keystore with alias androiddebugkey"; exit 1; }
            echo "FIXED_DEBUG_KEY=true" >> "$GITHUB_ENV"
            echo "Debug signing: fixed repo-secret keystore"
          else
            keytool -genkeypair -keystore "$ks" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null
            echo "FIXED_DEBUG_KEY=false" >> "$GITHUB_ENV"
            echo "::notice title=export-builds (android)::Debug signing: ephemeral key (no ANDROID_DEBUG_KEYSTORE_B64, e.g. fork PR). This APK will not install over earlier builds."
          fi
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          cfg="${HOME}/.config/godot"
          mkdir -p "$cfg"
          minor="$(echo "$GODOT_VERSION" | cut -d. -f1-2)"
          for f in "editor_settings-${minor}.tres" "editor_settings-${minor%%.*}.tres"; do
            cat > "${cfg}/${f}" <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${sdk}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${ks}"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          TRES
          done
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${ks}"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Install GUT if the project references it
        if: steps.inputs.outputs.present == 'true'
        run: |
          if grep -q 'addons/gut' client/project.godot; then
            .github/scripts/install-gut.sh client "$GUT_VERSION" "$GUT_SHA256"
          fi
      - name: godot --headless --import
        if: steps.inputs.outputs.present == 'true'
        run: godot --headless --path client --import
      - name: Export (${{ matrix.preset }}, debug)
        if: steps.inputs.outputs.present == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          godot --headless --path client --export-debug "$PRESET" "${OUT_DIR}/${OUT_FILE}"
          test -s "${OUT_DIR}/${OUT_FILE}" || { echo "::error::export produced no ${OUT_FILE}"; exit 1; }
          ls -la "$OUT_DIR"
      - name: Verify APK (aapt badging + apksigner)
        if: steps.inputs.outputs.present == 'true' && matrix.target == 'android'
        env:
          # Public cert digest of the ANDROID_DEBUG_KEYSTORE_B64 key (docs/qa/test-plan.md).
          EXPECTED_DEBUG_CERT_SHA256: 7352700cdd924eafaf67061a87d75999e0655caed6c9b178420779ecbf5c552f
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          bt="$(find "${sdk}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          apk="${OUT_DIR}/${OUT_FILE}"
          "${bt}/aapt" dump badging "$apk" | tee "${RUNNER_TEMP}/badging.txt" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|uses-permission|application-label):"
          grep -q "^package: name='dev.karyu.endlessrealm'" "${RUNNER_TEMP}/badging.txt" || { echo "::error::unexpected package name"; exit 1; }
          grep -q "^native-code:.*'arm64-v8a'" "${RUNNER_TEMP}/badging.txt" || { echo "::error::APK has no arm64-v8a libs"; exit 1; }
          grep -q "android.permission.INTERNET" "${RUNNER_TEMP}/badging.txt" || { echo "::error::APK lacks INTERNET permission"; exit 1; }
          "${bt}/apksigner" verify --verbose --print-certs "$apk" | grep -vE '^WARNING' | tee "${RUNNER_TEMP}/certs.txt"
          if [ "${FIXED_DEBUG_KEY:-false}" = "true" ]; then
            # Every signer cert digest (v2/v3 lines) must be the fixed one, and there must be at least one.
            digests="$(sed -nE 's/.*certificate SHA-256 digest: ([0-9a-f]{64})$/\1/p' "${RUNNER_TEMP}/certs.txt" | sort -u)"
            [ "$digests" = "$EXPECTED_DEBUG_CERT_SHA256" ] \
              || { echo "::error::APK is not signed with the fixed debug cert ${EXPECTED_DEBUG_CERT_SHA256} (got: ${digests:-none})"; exit 1; }
            echo "Signed with the fixed debug cert ${EXPECTED_DEBUG_CERT_SHA256}"
          fi
      - name: Smoke-run the Linux export headless
        if: steps.inputs.outputs.present == 'true' && matrix.target == 'linux'
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/linux-smoke.log"
          # Capture the run's exit code (pipefail: a crash, or 124 on timeout) instead of
          # letting set -e stop the step, so the scan below still prints the offending lines.
          rc=0
          timeout 60 "${OUT_DIR}/${OUT_FILE}" --headless --quit-after 120 2>&1 | tee "$log" || rc=$?
          # Only this smoke-run log is gated; import/export logs are not.
          # Strip ANSI colour codes so the anchored patterns still match.
          sed -E 's/\x1b\[[0-9;]*m//g' "$log" > "${log}.plain"
          fail=0
          if grep -qE 'SCRIPT ERROR|Parse Error|Failed to load script' "${log}.plain"; then
            echo "::error::Linux export hit script errors on startup"
            fail=1
          fi
          # Data lines catch exports that silently ship without data/ (#16), e.g.
          # "DataCatalog: cannot read ..." and "LocalSim.spawn_enemy: unknown id burrmite".
          if grep -nE '^(ERROR|SCRIPT ERROR):|DataCatalog: cannot read|DataCatalog:.*unknown id|spawn_enemy: unknown id' "${log}.plain" > "${log}.errors"; then
            echo "::error::Linux export logged engine/script/data errors during the headless smoke run:"
            sed 's/^/  /' "${log}.errors"
            fail=1
          fi
          if [ "$rc" -ne 0 ]; then
            if [ "$rc" -eq 124 ]; then
              echo "::error::Linux export did not exit within 60 s (timeout, exit 124)"
            else
              echo "::error::Linux export exited with code ${rc}"
            fi
            fail=1
          fi
          exit "$fail"
      - name: Upload ${{ matrix.target }} build
        if: steps.inputs.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 14
